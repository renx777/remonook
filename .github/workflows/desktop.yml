name: Desktop app
# Builds the RemoNook desktop app (Tauri) for Windows, Linux and macOS on GitHub's machines,
# then publishes one signed update for all three (latest.json lists each platform).
# Not code-signed yet: Windows shows a SmartScreen warning on first launch (More info → Run
# anyway); macOS asks once in System Settings → Privacy & Security (Open Anyway).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which sync server and Firebase project the app uses
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: desktop-${{ inputs.environment }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle: src-tauri/target/release/bundle
            args: ''
          # Ubuntu 22.04: its older glibc lets the app run on Debian 12 based systems too.
          - platform: linux
            os: ubuntu-22.04
            bundle: src-tauri/target/release/bundle
            args: --bundles deb,appimage
          # One app for both Apple silicon and Intel Macs.
          - platform: macos
            os: macos-latest
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            args: --target universal-apple-darwin --bundles app,dmg
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Secrets cannot appear in step conditions; expose only whether the key is set.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install the Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Add the Intel and Apple silicon Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build the app for ${{ inputs.environment }}
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            cp .env.production.example .env.production.local && npm run build:production
          else
            cp .env.staging.example .env.staging.local && npm run build:staging
          fi
      # Every build gets a new version (0.1.<run number>) so installers upgrade cleanly and the
      # updater can tell new from old. Builds are signed with the updater key when it is set.
      - name: Prepare the build configuration
        shell: bash
        env:
          CHANNEL: ${{ inputs.environment }}
        run: |
          node --input-type=module -e '
          import {readFileSync,writeFileSync} from "node:fs";
          const base=process.env.CHANNEL==="staging"?JSON.parse(readFileSync("src-tauri/tauri.staging.json","utf8")):{};
          const config={...base,version:"0.1.${{ github.run_number }}"};
          if(process.env.HAS_UPDATER_KEY!=="true"){config.bundle={...(config.bundle||{}),createUpdaterArtifacts:false};console.log("::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this build cannot be offered as an automatic update.");}
          writeFileSync("src-tauri/tauri.release.json",JSON.stringify(config,null,2));console.log("version",config.version);'
      - name: Build the ${{ matrix.platform }} installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          extra="--config src-tauri/tauri.release.json ${{ matrix.args }}"
          # The bundler downloads its packaging tools (NSIS, WiX, linuxdeploy); retry brief
          # download failures. A retry reuses the compiled app, so it only repeats the packaging.
          for attempt in 1 2 3; do npx tauri build $extra && exit 0; echo "::warning::Packaging attempt $attempt failed; retrying"; sleep 20; done
          [ "$RUNNER_OS" = "Windows" ] || exit 1
          # If the NSIS (.exe) tool download stays down, still produce the .msi installer.
          echo "::warning::Building the .msi installer only (the .exe packaging tool could not be downloaded)."
          npx tauri build $extra --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: RemoNook-${{ inputs.environment }}-${{ matrix.platform }}
          path: |
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
      # The signed update file and its signature, for the publish job below. update.json says
      # which updater platforms it serves and under which published name.
      - name: Collect the update files
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          CHANNEL: ${{ inputs.environment }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          dir="${{ matrix.bundle }}"; mkdir update
          case "${{ matrix.platform }}" in
            windows)
              file=$(ls $dir/nsis/*-setup.exe 2>/dev/null | head -1); suffix=x64-setup.exe
              if [ -z "$file" ]; then file=$(ls $dir/msi/*.msi | head -1); suffix=x64-installer.msi; fi
              platforms='["windows-x86_64"]';;
            linux) file=$(ls $dir/appimage/*.AppImage | head -1); suffix=amd64.AppImage; platforms='["linux-x86_64"]';;
            macos) file=$(ls $dir/macos/*.app.tar.gz | head -1); suffix=universal.app.tar.gz; platforms='["darwin-aarch64","darwin-x86_64"]';;
          esac
          test -f "$file.sig" || { echo "::error::No updater signature for $file"; exit 1; }
          name="RemoNook-${CHANNEL}_${VERSION}_${suffix}"
          cp "$file" "update/$name" && cp "$file.sig" "update/$name.sig"
          echo "{\"file\":\"$name\",\"platforms\":$platforms}" > update/update.json
      - if: env.HAS_UPDATER_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ inputs.environment }}-${{ matrix.platform }}
          path: update/
          if-no-files-found: error
  # Publish the update: every platform's signed file, then latest.json (last, so the app never sees
  # an update whose files are missing). Served by the sync Worker at /desktop/<channel>/.
  # A separate job, so a failed upload can be retried ("Re-run failed jobs") without rebuilding.
  # It runs only when all three builds succeeded, so every platform gets the same version.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS_UPDATER_KEY == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: update-${{ inputs.environment }}-*
          path: update
      - name: Publish the update
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          CHANNEL: ${{ inputs.environment }}
          VERSION: 0.1.${{ github.run_number }}
          CLOUDFLARE_ACCOUNT_ID: e9a5c70b0fbe2e2d493fc21de0bbb40f
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.CLOUDFLARE_PRODUCTION_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CHANNEL" = "production" ]; then BUCKET=remo-attachments; API=https://remo-sync.remo-978fb.workers.dev; else BUCKET=remo-attachments-staging; API=https://remo-sync-staging.remo-978fb.workers.dev; fi
          for meta in update/*/update.json; do
            dir=$(dirname "$meta"); name=$(node -p "require('./$meta').file")
            npx --yes wrangler@4 r2 object put "$BUCKET/desktop/$CHANNEL/$name" --file "$dir/$name" --remote || {
              echo "::error::Cloudflare refused the upload. The API token needs the account permission Workers R2 Storage: Edit. Fix the token, then use Re-run failed jobs."; exit 1; }
          done
          API="$API" node --input-type=module -e '
          import {readFileSync,writeFileSync,readdirSync} from "node:fs";
          const platforms={};
          for(const d of readdirSync("update")){const m=JSON.parse(readFileSync(`update/${d}/update.json`,"utf8"));
            const entry={signature:readFileSync(`update/${d}/${m.file}.sig`,"utf8").trim(),url:`${process.env.API}/desktop/${process.env.CHANNEL}/${m.file}`};
            for(const p of m.platforms)platforms[p]=entry;}
          if(Object.keys(platforms).length<4)throw Error("Expected Windows, Linux and both macOS entries, got "+Object.keys(platforms).join(", "));
          writeFileSync("latest.json",JSON.stringify({version:process.env.VERSION,notes:"RemoNook "+process.env.VERSION,pub_date:new Date().toISOString(),platforms},null,2));'
          cat latest.json
          npx --yes wrangler@4 r2 object put "$BUCKET/desktop/$CHANNEL/latest.json" --file latest.json --remote --content-type application/json
          echo "Published $VERSION: $API/desktop/$CHANNEL/latest.json"
