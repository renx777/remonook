name: Desktop app
# Builds the RemoNook desktop app (Tauri) installers on GitHub's machines.
# Unsigned for now: Windows shows a SmartScreen warning on first launch (More info → Run anyway).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which sync server and Firebase project the app uses
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: desktop-${{ inputs.environment }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Secrets cannot appear in step conditions; expose only whether the key is set.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the app for ${{ inputs.environment }}
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            cp .env.production.example .env.production.local && npm run build:production
          else
            cp .env.staging.example .env.staging.local && npm run build:staging
          fi
      # Every build gets a new version (0.1.<run number>) so installers upgrade cleanly and the
      # updater can tell new from old. Builds are signed with the updater key when it is set.
      - name: Prepare the build configuration
        shell: bash
        env:
          CHANNEL: ${{ inputs.environment }}
        run: |
          node --input-type=module -e '
          import {readFileSync,writeFileSync} from "node:fs";
          const base=process.env.CHANNEL==="staging"?JSON.parse(readFileSync("src-tauri/tauri.staging.json","utf8")):{};
          const config={...base,version:"0.1.${{ github.run_number }}"};
          if(process.env.HAS_UPDATER_KEY!=="true"){config.bundle={...(config.bundle||{}),createUpdaterArtifacts:false};console.log("::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this build cannot be offered as an automatic update.");}
          writeFileSync("src-tauri/tauri.release.json",JSON.stringify(config,null,2));console.log("version",config.version);'
      - name: Build the Windows installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          extra="--config src-tauri/tauri.release.json"
          # The bundler downloads its installer tools (NSIS, WiX); retry brief download failures.
          # A retry reuses the compiled app, so it only repeats the packaging.
          for attempt in 1 2 3; do npx tauri build $extra && exit 0; echo "::warning::Packaging attempt $attempt failed; retrying"; sleep 20; done
          # If the NSIS (.exe) tool download stays down, still produce the .msi installer.
          echo "::warning::Building the .msi installer only (the .exe packaging tool could not be downloaded)."
          npx tauri build $extra --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: RemoNook-${{ inputs.environment }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # The signed installer and its signature, for the publish job below.
      - name: Collect the update files
        id: update
        shell: bash
        run: |
          echo "signed=$HAS_UPDATER_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_UPDATER_KEY" = "true" ] || exit 0
          dir=src-tauri/target/release/bundle; mkdir update
          file=$(ls $dir/nsis/*-setup.exe 2>/dev/null | head -1); kind=setup.exe
          if [ -z "$file" ]; then file=$(ls $dir/msi/*.msi | head -1); kind=installer.msi; fi
          test -f "$file.sig" || { echo "::error::No updater signature for $file"; exit 1; }
          cp "$file" "update/installer.$kind" && cp "$file.sig" "update/installer.$kind.sig"
      - if: steps.update.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ inputs.environment }}
          path: update/
          if-no-files-found: error
    outputs:
      signed: ${{ steps.update.outputs.signed }}
  # Publish the update: the signed installer, then latest.json (last, so the app never sees an
  # update whose files are missing). Served by the sync Worker at /desktop/<channel>/.
  # A separate job, so a failed upload can be retried ("Re-run failed jobs") without rebuilding.
  publish:
    needs: windows
    if: needs.windows.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: update-${{ inputs.environment }}
          path: update
      - name: Publish the update
        env:
          CHANNEL: ${{ inputs.environment }}
          VERSION: 0.1.${{ github.run_number }}
          CLOUDFLARE_ACCOUNT_ID: e9a5c70b0fbe2e2d493fc21de0bbb40f
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.CLOUDFLARE_PRODUCTION_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CHANNEL" = "production" ]; then BUCKET=remo-attachments; API=https://remo-sync.remo-978fb.workers.dev; else BUCKET=remo-attachments-staging; API=https://remo-sync-staging.remo-978fb.workers.dev; fi
          file=$(ls update/installer.* | grep -v '\.sig$' | head -1); kind=${file#update/installer.}
          name="RemoNook-${CHANNEL}_${VERSION}_x64-${kind}"
          npx --yes wrangler@4 r2 object put "$BUCKET/desktop/$CHANNEL/$name" --file "$file" --remote || {
            echo "::error::Cloudflare refused the upload. The API token needs the account permission Workers R2 Storage: Edit. Fix the token, then use Re-run failed jobs."; exit 1; }
          node --input-type=module -e '
          import {readFileSync,writeFileSync} from "node:fs";
          const [file,url]=process.argv.slice(1);
          writeFileSync("latest.json",JSON.stringify({version:process.env.VERSION,notes:"RemoNook "+process.env.VERSION,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:readFileSync(file+".sig","utf8").trim(),url}}},null,2));' "$file" "$API/desktop/$CHANNEL/$name"
          npx --yes wrangler@4 r2 object put "$BUCKET/desktop/$CHANNEL/latest.json" --file latest.json --remote --content-type application/json
          echo "Published $VERSION: $API/desktop/$CHANNEL/latest.json"
