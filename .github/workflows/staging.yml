name: Staging frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-frontend
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_REMO_ENV: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp .env.staging.example .env.staging.local
      - run: npm run build:staging
      # Fast release-gating checks. The full suite remains in the separate CI workflow.
      - name: Run targeted staging regression checks
        run: |
          node scripts/prepare-tests.mjs
          node --test --test-concurrency=2 tests/divider-app.test.mjs tests/outline-selection.test.mjs tests/editor-echo.test.mjs tests/typing-app.test.mjs tests/content-edit.test.mjs tests/interaction-context.test.mjs tests/syntax-cache.test.mjs tests/editor-emoji-runtime.test.mjs tests/fluent.test.mjs tests/fluent-app.test.mjs tests/fluent-render.test.mjs tests/rough-annotations.test.mjs tests/rough-annotations-runtime.test.mjs tests/study-bullet-reveal-app.test.mjs tests/study-edit-app.test.mjs tests/study-library-app.test.mjs tests/dashboard.test.mjs tests/dashboard-app.test.mjs tests/research-app.test.mjs tests/research-search.test.mjs tests/research-results.test.mjs tests/environment.test.mjs tests/production.test.mjs tests/seo.test.mjs
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9a5c70b0fbe2e2d493fc21de0bbb40f
          command: deploy --config wrangler.staging.jsonc
