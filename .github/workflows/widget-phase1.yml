name: Widget phase 1 verification
on:
  pull_request:
    branches: [docs/widgets-spec]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Render actual Android widget views
        shell: bash
        working-directory: tools/widget-screenshots
        run: |
          set +e
          bash gradlew testDebugUnitTest --stacktrace > verification.log 2>&1
          result=$?
          if [ "$result" != 0 ]; then
            python3 -c 'import re; text=open("verification.log").read(); lines=[line for line in text.splitlines() if re.search(r"What went wrong|^> |^e:|error:|Caused by:|Could not|requires|not found|Exception|FAILURE|failed",line)]; print("::warning::"+"\n".join(lines[:20] or text.splitlines()[-20:]).replace("%","%25").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Render a review contact sheet
        if: success()
        run: |
          python3 -m pip install --quiet pillow
          python3 -c 'from PIL import Image,ImageOps,ImageDraw; import pathlib,base64; paths=sorted(pathlib.Path("docs/widgets/screenshots").glob("*.png")); sheet=Image.new("RGB",(800,((len(paths)+3)//4)*240),"white"); draw=ImageDraw.Draw(sheet); [(sheet.paste(ImageOps.contain(Image.open(p).convert("RGB"),(190,210)),((i%4)*200,(i//4)*240+20)),draw.text(((i%4)*200,(i//4)*240),p.stem,fill="black")) for i,p in enumerate(paths)]; sheet.save("docs/widgets/screenshots/contact-sheet.png"); print("::notice title=Widget contact sheet::"+base64.b64encode(pathlib.Path("docs/widgets/screenshots/contact-sheet.png").read_bytes()).decode())'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-screenshots
          path: |
            docs/widgets/screenshots/
            tools/widget-screenshots/build/reports/
            tools/widget-screenshots/verification.log
  rust:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci && npm run build
      - run: cargo test
        working-directory: src-tauri
