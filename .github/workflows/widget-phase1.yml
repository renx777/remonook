name: Widget phase 1 verification
on:
  pull_request:
    branches: [docs/widgets-spec]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Render actual Android widget views
        shell: bash
        working-directory: tools/widget-screenshots
        run: |
          set +e
          bash gradlew testDebugUnitTest --stacktrace > verification.log 2>&1
          result=$?
          if [ "$result" != 0 ]; then
            python3 - <<'PYLOG'
            import re
            text = open('verification.log').read()
            lines = [line for line in text.splitlines() if re.search(r'What went wrong|^> |^e:|error:|Caused by:|Could not|requires|not found|Exception|FAILURE|failed', line)]
            print('::warning::' + '\n'.join(lines[:20]).replace('%', '%25').replace('\n', '%0A'))
            PYLOG
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-screenshots
          path: |
            docs/widgets/screenshots/
            tools/widget-screenshots/build/reports/
            tools/widget-screenshots/verification.log
  rust:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci && npm run build
      - run: cargo test
        working-directory: src-tauri
