name: Android widget verification
on:
  pull_request:
    branches: [docs/widgets-spec, codex/android-widget-palettes]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/widgets/palettes.json'
      - '.github/workflows/widget-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: widget-phase1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Render actual Android widget views
        shell: bash
        working-directory: tools/widget-screenshots
        run: |
          set +e
          bash gradlew testDebugUnitTest --stacktrace > verification.log 2>&1
          result=$?
          if [ "$result" != 0 ]; then
            python3 -c 'import re; text=open("verification.log").read(); lines=[line for line in text.splitlines() if not line.startswith(("> Task","> Configure")) and re.search(r"What went wrong|^> |^e:|error:|Caused by:|Could not|requires|not found|Exception|FAILURE|failed",line)]; print("::warning::"+"\n".join(lines[:20] or text.splitlines()[-20:]).replace("%","%25").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Render a review contact sheet
        if: success()
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/widget-contact-sheet.py
      - name: Review suite-marigold-today
        run: python3 scripts/widget-review-image.py suite-marigold-today
      - name: Review suite-marigold-capture
        run: python3 scripts/widget-review-image.py suite-marigold-capture
      - name: Review suite-marigold-focus
        run: python3 scripts/widget-review-image.py suite-marigold-focus
      - name: Review suite-marigold-rhythm
        run: python3 scripts/widget-review-image.py suite-marigold-rhythm
      - name: Review suite-marigold-resurface
        run: python3 scripts/widget-review-image.py suite-marigold-resurface
      - name: Review suite-marigold-configure
        run: python3 scripts/widget-review-image.py suite-marigold-configure
      - name: Review suite-marigold-large-text
        run: python3 scripts/widget-review-image.py suite-marigold-large-text
      - name: Review suite-iris-today
        run: python3 scripts/widget-review-image.py suite-iris-today
      - name: Review suite-iris-capture
        run: python3 scripts/widget-review-image.py suite-iris-capture
      - name: Review suite-iris-focus
        run: python3 scripts/widget-review-image.py suite-iris-focus
      - name: Review suite-iris-rhythm
        run: python3 scripts/widget-review-image.py suite-iris-rhythm
      - name: Review suite-iris-resurface
        run: python3 scripts/widget-review-image.py suite-iris-resurface
      - name: Review suite-iris-configure
        run: python3 scripts/widget-review-image.py suite-iris-configure
      - name: Review suite-iris-large-text
        run: python3 scripts/widget-review-image.py suite-iris-large-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-widget-screenshots
          path: |
            docs/widgets/screenshots/
            tools/widget-screenshots/build/reports/
            tools/widget-screenshots/verification.log
  rust:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci && npm run build
      - run: cargo test
        working-directory: src-tauri
